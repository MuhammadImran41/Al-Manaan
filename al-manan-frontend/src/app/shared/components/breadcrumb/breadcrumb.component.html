<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol class="breadcrumb__list">
    <li *ngFor="let item of items; let last = last" class="breadcrumb__item">
      <a *ngIf="item.path && !last" [routerLink]="item.path" class="breadcrumb__link">
        {{ item.label }}
      </a>
      <span *ngIf="!item.path || last" class="breadcrumb__current" [attr.aria-current]="last ? 'page' : null">
        {{ item.label }}
      </span>
      <span *ngIf="!last" class="breadcrumb__sep" aria-hidden="true">/</span>
    </li>
  </ol>
</nav>
