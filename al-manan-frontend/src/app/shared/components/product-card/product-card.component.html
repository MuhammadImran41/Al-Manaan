<article class="product-card" #cardEl (click)="navigateToProduct()">

  <!-- Image -->
  <div class="product-card__image-wrap">
    <img
      [src]="product.mainImageUrl || 'assets/images/placeholder.svg'"
      [alt]="product.name"
      class="product-card__image"
      loading="lazy"
      (error)="onImgError($event)"
    />

    <!-- Badges -->
    <div class="product-card__badges">
      <span class="badge badge--new" *ngIf="product.isNew">New</span>
      <span class="badge badge--sale" *ngIf="product.salePrice">
        -{{ discountPercent }}%
      </span>
    </div>

    <!-- Quick actions overlay -->
    <div class="product-card__overlay">
      <button
        class="product-card__action-btn"
        (click)="toggleWishlist($event)"
        [class.wishlisted]="isWishlisted"
        aria-label="Wishlist"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          [attr.fill]="isWishlisted ? 'currentColor' : 'none'"
          stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/>
        </svg>
      </button>
      <button
        class="product-card__quick-add"
        (click)="addToCart($event)"
        [class.loading]="isAddingToCart"
        aria-label="Add to cart"
      >
        <span *ngIf="!isAddingToCart">Quick Add</span>
        <span *ngIf="isAddingToCart">Adding...</span>
      </button>
    </div>
  </div>

  <!-- Info -->
  <div class="product-card__info">
    <span class="product-card__category">{{ product.categoryName }}</span>
    <h3 class="product-card__name">{{ product.name }}</h3>

    <!-- Rating -->
    <div class="product-card__rating" *ngIf="product.reviewCount > 0">
      <div class="product-card__stars">
        <span *ngFor="let s of [1,2,3,4,5]" class="product-card__star"
          [class.filled]="s <= product.averageRating">â˜…</span>
      </div>
      <span class="product-card__review-count">({{ product.reviewCount }})</span>
    </div>

    <!-- Price -->
    <div class="product-card__price">
      <span class="price price--sale" *ngIf="product.salePrice">
        PKR {{ product.salePrice | number:'1.0-0' }}
      </span>
      <span class="price" [class.price--original]="product.salePrice">
        PKR {{ product.price | number:'1.0-0' }}
      </span>
    </div>

    <!-- Size swatches preview -->
    <div class="product-card__sizes" *ngIf="product.variants?.length">
      <span *ngFor="let v of product.variants | slice:0:5" class="product-card__size-tag">
        {{ v.size }}
      </span>
    </div>
  </div>

  <!-- Bottom CTA — always aligned at bottom -->
  <button class="product-card__add-btn"
          (click)="addToCart($event)"
          [class.loading]="isAddingToCart">
    <span *ngIf="!isAddingToCart">Add to Cart</span>
    <span *ngIf="isAddingToCart">Adding...</span>
  </button>

</article>
