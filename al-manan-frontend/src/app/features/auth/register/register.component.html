<div class="auth-page page-enter">
  <div class="auth-page__bg">
    <div class="auth-page__bg-image">
      <img src="assets/images/2.jpeg" alt="Al-Manan" />
    </div>
    <div class="auth-page__bg-brand">
      <h2 class="auth-page__bg-title">Join the<br/><em>House.</em></h2>
      <p class="auth-page__bg-sub">Create your account for exclusive access, early arrivals and members-only offers.</p>
    </div>
  </div>

  <div class="auth-page__card">
    <a routerLink="/" class="auth-page__logo">
      <div class="auth-page__logo-emblem"><span>م</span></div>
      <div class="auth-page__logo-text">
        <span class="auth-page__logo-text-en">AL-MANAN</span>
        <span class="auth-page__logo-text-tag">Premium Fashion</span>
      </div>
    </a>

    <h1 class="auth-page__title">Create Account</h1>
    <p class="auth-page__subtitle">Join Al-Manan for exclusive collections and offers</p>

    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" formControlName="firstName" class="form-control"
            [class.is-error]="fieldError('firstName')" placeholder="First" autocomplete="given-name"/>
          <span class="form-error" *ngIf="fieldError('firstName')">Required</span>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" formControlName="lastName" class="form-control"
            [class.is-error]="fieldError('lastName')" placeholder="Last" autocomplete="family-name"/>
          <span class="form-error" *ngIf="fieldError('lastName')">Required</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" formControlName="email" class="form-control"
          [class.is-error]="fieldError('email')" placeholder="you@example.com" autocomplete="email"/>
        <span class="form-error" *ngIf="fieldError('email')">Enter a valid email</span>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number (Optional)</label>
        <input type="tel" formControlName="phoneNumber" class="form-control"
          placeholder="03XX-XXXXXXX" autocomplete="tel"/>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="auth-form__password-wrap">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            class="form-control" [class.is-error]="fieldError('password')"
            placeholder="At least 6 characters" autocomplete="new-password"/>
          <button type="button" class="auth-form__eye-btn" (click)="showPassword = !showPassword">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12
                   4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0
                   .639C20.577 16.49 16.64 19.5 12 19.5c-4.638
                   0-8.573-3.007-9.963-7.178z"/>
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>
        </div>
        <span class="form-error" *ngIf="fieldError('password')">Minimum 6 characters</span>
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--lg" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-page__switch">
      Already have an account?
      <a routerLink="/auth/login">Sign in</a>
    </p>
  </div>
</div>
