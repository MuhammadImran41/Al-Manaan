<div class="admin page-enter">
  <div class="admin-header">
    <div>
      <h1>{{ isEdit ? 'Edit Product' : 'New Product' }}</h1>
      <p>{{ isEdit ? 'Update product details' : 'Add a new product to your store' }}</p>
    </div>
    <a routerLink="/admin/products" class="btn btn--ghost btn--sm">← Back to Products</a>
  </div>

  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

  <div class="admin-card" *ngIf="!isLoading" [formGroup]="form">
    <div class="form-grid">
      <div class="form-group form-group--full">
        <label class="form-label">Product Name *</label>
        <input type="text" formControlName="name" class="form-control" [class.is-error]="fieldError('name')" />
        <span class="form-error" *ngIf="fieldError('name')">Required</span>
      </div>

      <div class="form-group">
        <label class="form-label">Price (PKR) *</label>
        <input type="number" formControlName="price" class="form-control" [class.is-error]="fieldError('price')" />
      </div>

      <div class="form-group">
        <label class="form-label">Sale Price (PKR)</label>
        <input type="number" formControlName="salePrice" class="form-control" />
      </div>

      <div class="form-group">
        <label class="form-label">SKU *</label>
        <input type="text" formControlName="sku" class="form-control" [class.is-error]="fieldError('sku')" />
      </div>

      <div class="form-group">
        <label class="form-label">Stock Quantity</label>
        <input type="number" formControlName="stockQuantity" class="form-control" />
      </div>

      <div class="form-group form-group--full">
        <label class="form-label">Category *</label>
        <select formControlName="categoryId" class="form-control" [class.is-error]="fieldError('categoryId')">
          <option [value]="null">Select category...</option>
          <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
        </select>
      </div>

      <div class="form-group form-group--full">
        <label class="form-label">Short Description</label>
        <input type="text" formControlName="shortDescription" class="form-control" />
      </div>

      <div class="form-group form-group--full">
        <label class="form-label">Full Description *</label>
        <textarea formControlName="description" class="form-control" rows="5" [class.is-error]="fieldError('description')"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Fabric</label>
        <input type="text" formControlName="fabric" class="form-control" />
      </div>

      <div class="form-group">
        <label class="form-label">Care Instructions</label>
        <input type="text" formControlName="care" class="form-control" />
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:1.5rem;margin:1.5rem 0;padding:1.5rem 0;border-top:1px solid var(--color-border-light)">
      <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.875rem">
        <input type="checkbox" formControlName="isActive" style="accent-color:var(--color-primary)" /> Active
      </label>
      <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.875rem">
        <input type="checkbox" formControlName="isFeatured" style="accent-color:var(--color-primary)" /> Featured
      </label>
      <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.875rem">
        <input type="checkbox" formControlName="isBestSeller" style="accent-color:var(--color-primary)" /> Best Seller
      </label>
      <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.875rem">
        <input type="checkbox" formControlName="isNew" style="accent-color:var(--color-primary)" /> New Arrival
      </label>
    </div>

    <div style="display:flex;gap:1rem">
      <button class="btn btn--primary btn--lg" (click)="onSubmit()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : (isEdit ? 'Update Product' : 'Create Product') }}
      </button>
      <a routerLink="/admin/products" class="btn btn--ghost btn--lg">Cancel</a>
    </div>
  </div>
</div>
