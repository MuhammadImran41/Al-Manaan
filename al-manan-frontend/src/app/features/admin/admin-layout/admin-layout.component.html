<div class="admin-shell">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="admin-sidebar"
    [class.collapsed]="isSidebarCollapsed"
    [class.mobile-open]="isMobileSidebarOpen">

    <!-- Logo -->
    <a routerLink="/admin" class="admin-sidebar__logo">
      <div class="admin-sidebar__logo-icon">
        <img src="assets/images/logo.png" alt="Al-Manan" style="width:100%;height:100%;object-fit:contain" />
      </div>
      <div class="admin-sidebar__logo-text">
        <span>AL-MANAN</span>
        <span>Admin Panel</span>
      </div>
    </a>

    <!-- Navigation -->
    <nav class="admin-sidebar__nav">
      <span class="admin-sidebar__nav-label">Main Menu</span>

      <!-- Dashboard -->
      <a routerLink="/admin" class="admin-sidebar__nav-item"
        [class.active]="isActive({ route: '/admin', exact: true, label:'', icon:'' })">
        <span class="admin-sidebar__nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25
                 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25
                 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0
                 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0
                 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118
                 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0
                 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118
                 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
          </svg>
        </span>
        <span class="admin-sidebar__nav-text">Dashboard</span>
        <span class="admin-sidebar__tooltip">Dashboard</span>
      </a>

      <!-- Products -->
      <a routerLink="/admin/products" class="admin-sidebar__nav-item"
        [class.active]="isActive({ route: '/admin/products', label:'', icon:'' })">
        <span class="admin-sidebar__nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263
                 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0
                 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576
                 0 1.059.435 1.119 1.007z"/>
          </svg>
        </span>
        <span class="admin-sidebar__nav-text">Products</span>
        <span class="admin-sidebar__tooltip">Products</span>
      </a>

      <!-- Orders -->
      <a routerLink="/admin/orders" class="admin-sidebar__nav-item"
        [class.active]="isActive({ route: '/admin/orders', label:'', icon:'' })">
        <span class="admin-sidebar__nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0
                 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424
                 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664
                 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25
                 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012
                 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095
                 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621
                 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125
                 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/>
          </svg>
        </span>
        <span class="admin-sidebar__nav-text">Orders</span>
        <span class="admin-sidebar__tooltip">Orders</span>
      </a>

      <div class="admin-sidebar__divider"></div>
      <span class="admin-sidebar__nav-label">Settings</span>

      <!-- Buyer Profiles -->
      <a routerLink="/admin/buyers" class="admin-sidebar__nav-item"
        [class.active]="isActive({ route: '/admin/buyers', label:'', icon:'' })">
        <span class="admin-sidebar__nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94
                 4.198l.94.052a9 9 0 008.716-6.747M18 18.72a9.094 9.094 0
                 01-8.72 0M15 6a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0
                 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5
                 0 2.25 2.25 0 014.5 0z"/>
          </svg>
        </span>
        <span class="admin-sidebar__nav-text">Buyer Profiles</span>
        <span class="admin-sidebar__tooltip">Buyer Profiles</span>
      </a>

      <!-- View Store -->
      <a routerLink="/" target="_blank" class="admin-sidebar__nav-item">
        <span class="admin-sidebar__nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0
                 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5
                 6L21 3m0 0h-5.25M21 3v5.25"/>
          </svg>
        </span>
        <span class="admin-sidebar__nav-text">View Store</span>
        <span class="admin-sidebar__tooltip">View Store</span>
      </a>
    </nav>

    <!-- Collapse toggle (desktop only) -->
    <div class="admin-sidebar__toggle">
      <button (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5"
            *ngIf="!isSidebarCollapsed"/>
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M5.25 4.5l7.5 7.5-7.5 7.5m6-15l7.5 7.5-7.5 7.5"
            *ngIf="isSidebarCollapsed"/>
        </svg>
        <span *ngIf="!isSidebarCollapsed">Collapse</span>
      </button>
    </div>

    <!-- User info -->
    <div class="admin-sidebar__user" *ngIf="currentUser$ | async as user">
      <div class="admin-sidebar__user-info">
        <div class="admin-sidebar__user-avatar">
          {{ user.firstName ? user.firstName.charAt(0) : 'A' }}
        </div>
        <div class="admin-sidebar__user-details">
          <p>{{ user.firstName }} {{ user.lastName }}</p>
          <p>Administrator</p>
        </div>
        <button class="admin-sidebar__logout-btn" (click)="logout()" title="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0
                 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25
                 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Mobile overlay -->
  <div class="admin-mobile-overlay"
    [class.active]="isMobileSidebarOpen"
    (click)="isMobileSidebarOpen = false">
  </div>

  <!-- ===================== MAIN ===================== -->
  <div class="admin-main" [class.sidebar-collapsed]="isSidebarCollapsed">

    <!-- Topbar -->
    <header class="admin-topbar">
      <div class="admin-topbar__left">
        <!-- Hamburger (mobile) / toggle (desktop) -->
        <button class="admin-topbar__hamburger" (click)="toggleMobileSidebar()" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <div class="admin-topbar__breadcrumb">
          <span>Al-Manan</span>
          <span>›</span>
          <strong>Admin</strong>
        </div>
      </div>

      <div class="admin-topbar__right">
        <!-- Notification bell placeholder -->
        <button class="admin-topbar__icon-btn" title="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967
                 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0
                 01-2.312 6.022c1.733.64 3.56 1.085 5.455
                 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714
                 0a3 3 0 11-5.714 0"/>
          </svg>
        </button>

        <!-- View store link -->
        <a routerLink="/" class="admin-topbar__store-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0
                 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5
                 6L21 3m0 0h-5.25M21 3v5.25"/>
          </svg>
          View Store
        </a>

        <!-- Logout -->
        <button class="admin-topbar__icon-btn" (click)="logout()" title="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0
                 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25
                 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page content (lazy-loaded child routes render here) -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
